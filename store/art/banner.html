<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Lilita One'; src: url('../../public/fonts/LilitaOne.woff2') format('woff2'); }
html,body{margin:0;width:1200px;height:600px;overflow:hidden;font-family:'Lilita One',sans-serif}
.shot{position:absolute;inset:0;background:url('banner-bg.jpg') center/cover}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,13,46,.92) 0%,rgba(22,13,46,.7) 38%,rgba(22,13,46,0) 58%)}
.box{position:absolute;left:64px;top:100px;width:600px}
h1{margin:0;font-size:104px;line-height:1;color:#fffaf0;-webkit-text-stroke:6px #160d2e;paint-order:stroke fill;text-shadow:7px 7px 0 #9945ff}
p{margin:22px 0 0;font-size:40px;color:#fffaf0;line-height:1.15}
.gm{display:inline-block;background:#14f195;color:#160d2e;border:4px solid #160d2e;border-radius:14px;padding:0 14px;box-shadow:4px 4px 0 #160d2e;transform:rotate(-3deg)}
.tags{margin-top:30px;display:flex;gap:14px}
.tag{background:#ffe14d;color:#160d2e;border:4px solid #160d2e;border-radius:999px;padding:6px 20px;font-size:28px;box-shadow:4px 4px 0 #160d2e}
.tag.p{background:#ff9ad5}.tag.g{background:#5ad1ff}
</style></head><body>
<div class="shot"></div><div class="fade"></div>
<div class="box">
  <h1>Quiet Hall</h1>
  <p><span class="gm">gm.</span> Sit together in silence.</p>
  <div class="tags"><span class="tag">🧘 sit</span><span class="tag p">🐕 pets</span><span class="tag g">🏮 lanterns</span></div>
</div>
</body></html>
