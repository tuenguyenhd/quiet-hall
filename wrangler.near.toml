# NEAR edition (design/gdd/edition-near.md). Separate Worker and separate world from the Seeker edition.
# Local:  npx wrangler dev -c wrangler.near.toml --env-file .dev.vars.near --port 8788
#   .dev.vars.near must point at the TEST contract (NEAR_ACCOUNT=quiethall-b4ac38.testnet + its key).
#   Never put the production key in a local file: two Workers writing one contract collide on round commits.
# Secrets (production only, wrangler secret put -c wrangler.near.toml): NEAR_PRIVATE_KEY, OWNER_SECRET, SESSION_SECRET
name = "quiet-hall-near"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "HALL"
class_name = "Hall"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[durable_objects.bindings]]
name = "PUMP"
class_name = "Pump"

[[durable_objects.bindings]]
name = "ECONOMY"
class_name = "Economy"

[[durable_objects.bindings]]
name = "MIRROR"
class_name = "Mirror"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hall", "Ledger", "Pump", "Economy", "Mirror"]

[vars]
EDITION = "near"
# production contract (real-clock data only). Live tests use quiethall-b4ac38.testnet via .dev.vars.near-test
NEAR_ACCOUNT = "quiethall-521e7c.testnet"
NEAR_RPC = "https://test.rpc.fastnear.com"
NEAR_RPC_FALLBACKS = "https://rpc.testnet.near.org"
PUBLIC_URL = "https://quiet-hall-near.ted-233.workers.dev"
# The Solana features are off in this edition; these keep shared code paths well-defined.
SOLANA_CLUSTER = "devnet"
SOLANA_RPC = "https://api.devnet.solana.com"
MAINNET_RPC = "https://api.mainnet-beta.solana.com"
TIP_RECIPIENT = ""
USDC_MINT = ""
